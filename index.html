<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Note Quest</title>
  <meta name="description" content="Learn to read music notes on the staff — a fun game for kids and beginners." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#7C4DFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    /* Light theme (default — kid friendly) */
    :root{
      --bg:#f3f0ff; --bg2:#ffffff; --txt:#1d1240; --hint:#6b6390; --border:#e2dcf5;
      --accent:#7C4DFF; --good:#22C55E; --bad:#EF4444; --gold:#FFB300;
      --staff:#2a2350; --note:#7C4DFF;
    }
    /* Dark theme */
    :root[data-theme="dark"]{
      --bg:#15102b; --bg2:#1f1840; --txt:#f3f0ff; --hint:#a79fd0; --border:#332a5e;
      --accent:#9B7BFF; --good:#34D77B; --bad:#FF6B6B; --gold:#FFC93C;
      --staff:#d8d0ff; --note:#B49BFF;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; padding:0;}
    body{
      background:var(--bg); color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    /* The playfield is a fixed-height column, so on a tall phone or an iPad it would otherwise sit
       in the top half with dead space beneath. `margin:auto` on a flex child centres it only when
       there IS slack and never clips when the content is taller than the viewport (which
       align-items:center would). */
    body{min-height:100dvh; display:flex;}
    #root{max-width:560px; width:100%; margin:auto; padding:16px 16px env(safe-area-inset-bottom);}
    .nq-staff{max-width:320px;}
    /* iPad and other large screens: scale the whole thing up rather than stranding it in a narrow
       column. Type is rem-based, so raising the root size carries most of the layout with it. */
    @media (min-width:700px){
      html{font-size:23px;}
      #root{max-width:860px;}
      .nq-staff{max-width:660px;}
    }
    button{font-family:inherit;}
    /* Reward animations (kid celebration) */
    @keyframes nq-fall { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(170px) rotate(400deg);opacity:0} }
    @keyframes nq-badge { 0%{transform:scale(0) rotate(-18deg);opacity:0} 55%{transform:scale(1.3) rotate(8deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes nq-pop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.15);opacity:1} 100%{transform:scale(1);opacity:1} }
    /* instrument strum wiggle (tap to play) */
    @keyframes nq-strum { 0%{transform:rotate(0)} 18%{transform:rotate(-3deg) scale(1.03)} 46%{transform:rotate(2.4deg)} 72%{transform:rotate(-1.2deg)} 100%{transform:rotate(0)} }
  </style>
  <script>
    /* NO ANALYTICS — deliberately. Note Quest ships in the App Store Kids Category, and guideline
     * 1.3 forbids third-party analytics there. That is a standing constraint, not a TODO: do not
     * add an analytics SDK or key to this app. The analytics key placeholder that used to sit here
     * was removed so it cannot be wired up by mistake, and a test in test/shipping.test.cjs fails
     * if one reappears. See STORE.md → Kids Category. */
    // RevenueCat public SDK key — injected by the native (Capacitor) build.
    // On the web/PWA build this stays a placeholder and there is no store (see IS_DEV in app.js).
    window.__RC_KEY__='__RC_KEY__';
  </script>
</head>
<body>
  <!-- #root is NOT empty pre-mount: if a script fails, an empty #root renders as a blank purple page,
       which on iOS reads as a broken app (and is a Guideline 2.1 rejection risk — Jazz Guitar Lab hit
       exactly this). The placeholder below is removed by app.js once React mounts. -->
  <div id="root">
    <div id="nq-boot" style="text-align:center;padding:72px 16px;">
      <div style="font-size:2.8rem;line-height:1">🎵</div>
      <div style="font-weight:900;font-size:1.35rem;margin-top:8px;color:var(--txt)">Note Quest</div>
      <div id="nq-boot-msg" style="margin-top:8px;font-size:.95rem;color:var(--hint)">Loading…</div>
      <button id="nq-boot-reload" type="button" style="display:none;margin-top:16px;padding:12px 22px;border-radius:12px;border:none;cursor:pointer;font-weight:800;font-size:1rem;background:var(--accent);color:#fff">Reload</button>
    </div>
  </div>
  <script>
    /* Boot watchdog. Runs BEFORE the scripts below so it catches their load failures too.
     * Only fires while the app has not mounted, so a later unrelated error can't wipe a running app. */
    (function () {
      var done = false;
      function fail(detail) {
        if (done || window.__nqMounted) return;
        done = true;
        var msg = document.getElementById('nq-boot-msg');
        var btn = document.getElementById('nq-boot-reload');
        if (!msg || !btn) return;   // placeholder already gone — app is up, nothing to show
        msg.textContent = 'Note Quest didn’t finish loading.';
        btn.style.display = 'inline-block';
        btn.onclick = function () { location.reload(); };
        if (detail && window.console) console.error('Note Quest boot failed:', detail);
      }
      window.__nqBootFail = fail;
      window.addEventListener('error', function (ev) { fail(ev && (ev.message || ev.type)); });
      setTimeout(function () { fail('timeout'); }, 5000);
    })();
  </script>
  <!-- React 18.2.0 vendored locally so the app works offline and inside the native shell -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="app.js"></script>
  <script>
    // web/PWA only — the native shell serves files from the app bundle (no SW on capacitor://)
    if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
